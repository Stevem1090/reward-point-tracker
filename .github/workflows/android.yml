name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build web fallback
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Ensure Android SDK components
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Create Android project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          bunx cap add android
          if [ -n "$ANDROID_HOME" ]; then echo "sdk.dir=$ANDROID_HOME" > android/local.properties; fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node scripts/patch-android.mjs
          bunx cap sync android

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: familyhub
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then echo "Keystore secret missing or empty"; exit 1; fi
          export KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/FamilyHub.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Family Hub 1.0.${{ github.run_number }}
          files: FamilyHub.apk
